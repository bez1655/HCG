<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <!-- Base Metallic Gradients -->
      <radialGradient id="metalGrad" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#38444d" />
        <stop offset="50%" stop-color="#1f2933" />
        <stop offset="100%" stop-color="#0b0f14" />
      </radialGradient>

      <radialGradient id="sphereGrad" cx="30%" cy="25%" r="75%">
        <stop offset="0%" stop-color="#485665" />
        <stop offset="40%" stop-color="#212932" />
        <stop offset="85%" stop-color="#0c1015" />
        <stop offset="100%" stop-color="#05070a" />
      </radialGradient>

      <!-- Placeholder Neon Glow gradient (will be dynamically colored via CSS/JS or default cyber cyan/green) -->
      <!-- Свечение фишки. Цвет подставляется на стороне приложения из
           профиля игрока (см. src/components/ChipImage.tsx): фишка должна
           светиться тем цветом, который человек выбрал при входе, а не
           одинаковым зелёно-голубым у всех.
           Значения в var(...) — запасные, на случай показа вне игры. -->
      <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--chip-glow, #00ffaa)" />
        <stop offset="100%" stop-color="var(--chip-glow-2, #00ccff)" />
      </linearGradient>

      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.8" />
      </filter>
    </defs>

    
        <!-- Outer Ring Teeth -->
        <g stroke="#1a202c" stroke-width="12" fill="none">
          <circle cx="256" cy="256" r="210" stroke="#0d1117" stroke-width="24" />
          <circle cx="256" cy="256" r="190" stroke="#161b22" stroke-width="8" stroke-dasharray="18 12" />
        </g>
        <!-- Metallic Armor Segments -->
        <circle cx="256" cy="256" r="170" fill="url(#metalGrad)" stroke="#30363d" stroke-width="6" />
        <!-- Neon Energy Ring -->
        <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonGlow)" stroke-width="14" filter="url(#glow)" />
        <!-- Radial Vanes -->
        <g stroke="#000" stroke-width="4" opacity="0.8">
          <line x1="356" y1="256" x2="421" y2="256" stroke="#000" stroke-width="6"/>
                    <line x1="356" y1="256" x2="421" y2="256" stroke="url(#neonGlow)" stroke-width="2"/><line x1="342.6025403784439" y1="306" x2="398.8941916244324" y2="338.5" stroke="#000" stroke-width="6"/>
                    <line x1="342.6025403784439" y1="306" x2="398.8941916244324" y2="338.5" stroke="url(#neonGlow)" stroke-width="2"/><line x1="306" y1="342.60254037844385" x2="338.5" y2="398.8941916244324" stroke="#000" stroke-width="6"/>
                    <line x1="306" y1="342.60254037844385" x2="338.5" y2="398.8941916244324" stroke="url(#neonGlow)" stroke-width="2"/><line x1="256" y1="356" x2="256" y2="421" stroke="#000" stroke-width="6"/>
                    <line x1="256" y1="356" x2="256" y2="421" stroke="url(#neonGlow)" stroke-width="2"/><line x1="206.00000000000003" y1="342.6025403784439" x2="173.50000000000006" y2="398.8941916244324" stroke="#000" stroke-width="6"/>
                    <line x1="206.00000000000003" y1="342.6025403784439" x2="173.50000000000006" y2="398.8941916244324" stroke="url(#neonGlow)" stroke-width="2"/><line x1="169.39745962155612" y1="306" x2="113.10580837556762" y2="338.5" stroke="#000" stroke-width="6"/>
                    <line x1="169.39745962155612" y1="306" x2="113.10580837556762" y2="338.5" stroke="url(#neonGlow)" stroke-width="2"/><line x1="156" y1="256" x2="91" y2="256" stroke="#000" stroke-width="6"/>
                    <line x1="156" y1="256" x2="91" y2="256" stroke="url(#neonGlow)" stroke-width="2"/><line x1="169.39745962155615" y1="206" x2="113.10580837556762" y2="173.5" stroke="#000" stroke-width="6"/>
                    <line x1="169.39745962155615" y1="206" x2="113.10580837556762" y2="173.5" stroke="url(#neonGlow)" stroke-width="2"/><line x1="205.99999999999994" y1="169.39745962155615" x2="173.49999999999994" y2="113.10580837556765" stroke="#000" stroke-width="6"/>
                    <line x1="205.99999999999994" y1="169.39745962155615" x2="173.49999999999994" y2="113.10580837556765" stroke="url(#neonGlow)" stroke-width="2"/><line x1="255.99999999999997" y1="156" x2="255.99999999999997" y2="91" stroke="#000" stroke-width="6"/>
                    <line x1="255.99999999999997" y1="156" x2="255.99999999999997" y2="91" stroke="url(#neonGlow)" stroke-width="2"/><line x1="306" y1="169.39745962155615" x2="338.5" y2="113.10580837556762" stroke="#000" stroke-width="6"/>
                    <line x1="306" y1="169.39745962155615" x2="338.5" y2="113.10580837556762" stroke="url(#neonGlow)" stroke-width="2"/><line x1="342.60254037844385" y1="205.99999999999994" x2="398.8941916244323" y2="173.49999999999994" stroke="#000" stroke-width="6"/>
                    <line x1="342.60254037844385" y1="205.99999999999994" x2="398.8941916244323" y2="173.49999999999994" stroke="url(#neonGlow)" stroke-width="2"/>
        </g>
        <!-- Center Core Reactor -->
        <circle cx="256" cy="256" r="80" fill="#090d16" stroke="url(#neonGlow)" stroke-width="8" />
        <circle cx="256" cy="256" r="50" fill="url(#neonGlow)" filter="url(#glow)" />
        <circle cx="256" cy="256" r="25" fill="#ffffff" />
      
  </svg>