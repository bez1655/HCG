<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="metalc1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d2a1a"/>
      <stop offset="55%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="neonGlowc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--chip-glow, #ff7a18)"/>
      <stop offset="100%" stop-color="var(--chip-glow-2, #ffd36a)"/>
    </linearGradient>
    <filter id="glowc1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
