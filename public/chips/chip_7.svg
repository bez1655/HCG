      <stop offset="0%" stop-color="#3d2a1a"/>
      <stop offset="55%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="neonGlowc7" x1="0%" y1="0%" x2="100%" y2="100%">
