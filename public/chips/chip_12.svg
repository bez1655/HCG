<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="metalc12" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d2a1a"/>
      <stop offset="55%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="neonGlowc12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--chip-glow, #ff7a18)"/>
      <stop offset="100%" stop-color="var(--chip-glow-2, #ffd36a)"/>
    </linearGradient>
    <filter id="glowc12" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>
  <circle cx="256" cy="256" r="220" fill="#120a06" stroke="#2a1810" stroke-width="18"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#4a2c14" stroke-width="6" stroke-dasharray="10 14"/>
