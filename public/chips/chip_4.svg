<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <!-- Base Metallic Gradients -->
      <radialGradient id="metalGrad" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#38444d" />
        <stop offset="50%" stop-color="#1f2933" />
        <stop offset="100%" stop-color="#0b0f14" />
      </radialGradient>

      <radialGradient id="sphereGrad" cx="30%" cy="25%" r="75%">
        <stop offset="0%" stop-color="#485665" />
        <stop offset="40%" stop-color="#212932" />
        <stop offset="85%" stop-color="#0c1015" />
        <stop offset="100%" stop-color="#05070a" />
      </radialGradient>

      <!-- Placeholder Neon Glow gradient (will be dynamically colored via CSS/JS or default cyber cyan/green) -->
      <!-- Свечение фишки. Цвет подставляется на стороне приложения из
           профиля игрока (см. src/components/ChipImage.tsx): фишка должна
           светиться тем цветом, который человек выбрал при входе, а не
           одинаковым зелёно-голубым у всех.
           Значения в var(...) — запасные, на случай показа вне игры. -->
      <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--chip-glow, #00ffaa)" />
        <stop offset="100%" stop-color="var(--chip-glow-2, #00ccff)" />
      </linearGradient>

      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.8" />
      </filter>
    </defs>

    
        <ellipse cx="256" cy="430" rx="140" ry="20" fill="none" stroke="url(#neonGlow)" stroke-width="6" filter="url(#glow)" />
        <circle cx="256" cy="220" r="175" fill="url(#metalGrad)" stroke="#30363d" stroke-width="8" />
        <!-- Panel grid -->
        <circle cx="256" cy="220" r="140" fill="none" stroke="#0d1117" stroke-width="12" stroke-dasharray="40 20" />
        <circle cx="256" cy="220" r="110" fill="none" stroke="url(#neonGlow)" stroke-width="8" filter="url(#glow)" />
        <!-- Diodes around sphere -->
        <circle cx="396" cy="220" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="354.99494936611666" cy="318.99494936611666" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="256" cy="360" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="157.00505063388334" cy="318.99494936611666" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="116" cy="220.00000000000003" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="157.00505063388334" cy="121.00505063388336" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="255.99999999999997" cy="80" r="12" fill="url(#neonGlow)" filter="url(#glow)"/><circle cx="354.99494936611666" cy="121.00505063388333" r="12" fill="url(#neonGlow)" filter="url(#glow)"/>
        <circle cx="256" cy="220" r="55" fill="#000" stroke="url(#neonGlow)" stroke-width="6" />
        <polygon points="256,180 291,240 221,240" fill="url(#neonGlow)" filter="url(#glow)" />
      
  </svg>