services:
  hcg_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcg_app
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Secrets are supplied via .env — never hardcoded here.
      # Generate the hash with: npm run hash-password -- 'your-password'
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_ADMIN_USERNAME=${TELEGRAM_ADMIN_USERNAME}
      # The SERVER sends turn requests, prize announcements and registration
      # alerts itself, so it needs the same proxy as the bot. Configuring only
      # the bot produced a bot that answered /start while every in-game
      # notification vanished without a trace.
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - PROXY_LEASE_SIZE=${HARVEST_LEASE:-5}
      - WEB_APP_URL=${WEB_APP_URL}
      # Firestore is accessed through the Admin SDK with a service account.
      # Provide the key as JSON, or mount a file and point
      # GOOGLE_APPLICATION_CREDENTIALS at it (see the commented volume below).
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_FIRESTORE_DATABASE_ID=${FIREBASE_FIRESTORE_DATABASE_ID:-}
      # Optional: only needed once, to migrate legacy AES-encrypted passwords.
      - LEGACY_AES_PASSWORD=${LEGACY_AES_PASSWORD:-}
    volumes:
      - hapstore-data:/app/data
      # Mount the service-account key read-only instead of passing it inline:
      # - ./service-account.json:/run/secrets/service-account.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  hcg_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: hcg_bot
    restart: always
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_ADMIN_USERNAME=${TELEGRAM_ADMIN_USERNAME}
      - WEB_APP_URL=${WEB_APP_URL}
      # Optional outbound proxy, for hosts that cannot reach api.telegram.org.
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - TELEGRAM_PROXY_CHECK_MS=${TELEGRAM_PROXY_CHECK_MS:-60000}
      - PROXY_LEASE_SIZE=${HARVEST_LEASE:-5}
      # Бот ходит в Telegram напрямую. Парсер (hcg_proxy) при этом живёт —
      # админ забирает адреса командой /proxies.
      - BOT_USE_PROXY=${BOT_USE_PROXY:-0}
      - GAME_SERVER_URL=http://hcg_app:3000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      - DATA_DIR=/app/data
    depends_on:
      hcg_app:
        condition: service_healthy
    volumes:
      - hapstore-data:/app/data
    security_opt:
      - no-new-privileges:true

  # Finds working proxies and removes dead ones, continuously.
  #
  # Free public proxies live hours. A static TELEGRAM_PROXY therefore decays
  # into a list of corpses and the bot goes silent with no code change and no
  # error — the failure we kept chasing. This container scrapes public lists,
  # verifies each candidate against api.telegram.org itself, and writes the
  # survivors to the shared volume, where the bot and the server pick them up
  # without a restart.
  #
  # Separate container on purpose: verification opens hundreds of sockets that
  # mostly time out. Inside the bot process that would stall Telegram polling
  # every cycle, and a crash would take the game down with it.
  hcg_proxy:
    build:
      context: ./proxy-harvester
      dockerfile: Dockerfile
    container_name: hcg_proxy
    restart: always
    environment:
      - NODE_ENV=production
      - PROXY_DATA_DIR=/app/data
      # Manual addresses are pinned: they are never evicted by scraped ones.
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      # A full cycle every 10 minutes. Scraping only happens when the list is
      # below target, so healthy periods cost almost nothing.
      - HARVEST_INTERVAL_MS=${HARVEST_INTERVAL_MS:-600000}
      - HARVEST_CONCURRENCY=${HARVEST_CONCURRENCY:-120}
      - HARVEST_TIMEOUT_MS=${HARVEST_TIMEOUT_MS:-10000}
      # Reserve of verified proxies nobody holds yet: 15-20 on hand at all
      # times, so a consumer that loses one is topped up from stock rather
      # than waiting for a scrape.
      - HARVEST_TARGET=${HARVEST_TARGET:-18}
      - HARVEST_MIN_RESERVE=${HARVEST_MIN_RESERVE:-15}
      - HARVEST_MAX=${HARVEST_MAX:-20}
      # Working proxies granted to each consumer (bot and server separately).
      - HARVEST_LEASE=${HARVEST_LEASE:-5}
    volumes:
      - hapstore-data:/app/data
    # No depends_on: the harvester is useful before anything else is up, and
    # the bot must not wait on it — a stalled harvester would then block the
    # whole stack.
    security_opt:
      - no-new-privileges:true

volumes:
  hapstore-data:
